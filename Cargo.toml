[package]
name = "audp-ecm-python"
version = "0.2.0"
edition = "2021"
authors = ["Sbruice Singh <sbruicesingh@haclon.in>"]
license-file = "LICENSE"
description = "Python bindings for AUDP-ECM (Reed–Solomon, BCH, CRC, burst interleaving)"
repository = "https://github.com/SbruiceS/AUDP-ECM-Python"
publish = false

[lib]
name = "audp_ecm_native"
crate-type = ["cdylib"]

[dependencies]
# Stable ABI (abi3): one wheel per platform works on CPython >= 3.10
# (3.9 is end-of-life and no longer receives security fixes).
pyo3 = { version = "0.30", features = ["abi3-py310"] }

# AUDP-ECM core (private repository). Pinned by commit for reproducible,
# reviewable builds; bump deliberately. Local development can override this
# with a gitignored `.cargo/config.toml` [patch] (see CONTRIBUTING.md).
ecm-kernels = { git = "https://github.com/SbruiceS/AUDP-ECM", rev = "dac54f1d0f9fff59991c42a5554fb73bcdb0a879" }
ecm-algebraic-codes = { git = "https://github.com/SbruiceS/AUDP-ECM", rev = "dac54f1d0f9fff59991c42a5554fb73bcdb0a879" }
ecm-core = { git = "https://github.com/SbruiceS/AUDP-ECM", rev = "dac54f1d0f9fff59991c42a5554fb73bcdb0a879" }
ecm-probabilistic = { git = "https://github.com/SbruiceS/AUDP-ECM", rev = "dac54f1d0f9fff59991c42a5554fb73bcdb0a879" }

[features]
# Enabled by maturin when building the extension module.
extension-module = ["pyo3/extension-module"]

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "debuginfo"
