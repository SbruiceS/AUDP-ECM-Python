name: Benchmarks

# Reproducible performance numbers for a *released* version: downloads that
# release's published wheels (checksum-verified), runs benchmarks/bench.py on
# GitHub-hosted runners, and uploads the JSON results as artifacts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to benchmark (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and verify release wheels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "*.whl" --pattern SHA256SUMS --dir wheels
          cd wheels
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi

      - name: Install released wheel (no source build)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --no-index --find-links wheels audp-ecm
          python -c "import audp_ecm; print('audp-ecm', audp_ecm.__version__)"

      - name: Run benchmarks
        shell: bash
        run: python benchmarks/bench.py --out "bench-${{ matrix.label }}.json"

      - name: Job summary
        shell: bash
        run: |
          python - "bench-${{ matrix.label }}.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"### audp-ecm {d['audp_ecm_version']} · {d['platform']} · {d['cpu']} · Python {d['python']}")
          print(f"noisy: {d['noisy']} · peak RSS: {(d['peak_rss_bytes'] or 0) // 1024} KiB\n")
          print("| code | operation | median µs | min µs | MB/s | heap B |\n|---|---|---:|---:|---:|---:|")
          for r in d["results"]:
              print(f"| {r['code']} | {r['op']} | {r['median_ns']/1e3:.2f} | {r['min_ns']/1e3:.2f} | {r['throughput_mb_s']:.1f} | {r['heap_peak_bytes']} |")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.label }}
          path: bench-${{ matrix.label }}.json
          if-no-files-found: error
