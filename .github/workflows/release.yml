name: Release

# Build abi3 wheels + sdist on a version tag, attest provenance, and publish to
# PyPI with Trusted Publishing (OIDC) — no long-lived PyPI token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  wheels:
    name: Wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: universal2-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grant read access to the private core (host builds)
        shell: bash
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/SbruiceS/AUDP-ECM".insteadOf "https://github.com/SbruiceS/AUDP-ECM"

      - uses: PyO3/maturin-action@v1
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          docker-options: -e CORE_REPO_TOKEN -e CARGO_NET_GIT_FETCH_WITH_CLI=true
          before-script-linux: |
            git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/SbruiceS/AUDP-ECM".insteadOf "https://github.com/SbruiceS/AUDP-ECM"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Grant read access to the private core
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/SbruiceS/AUDP-ECM".insteadOf "https://github.com/SbruiceS/AUDP-ECM"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: Attest and publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi            # protect with required reviewers in repo settings
    permissions:
      id-token: write            # OIDC for Trusted Publishing + attestations
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
